- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Ensure dependencies are installed
  ansible.builtin.package:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - gpg
      - bash-completion
    state: present

- name: Create GPG key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Check if the kubernetes signing key file exists
  stat:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  register: k8s_gpg_key_check

- name: Download the public signing key for the Kubernetes package repositories
  shell: curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubectl_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true
  when: not k8s_gpg_key_check.stat.exists

- name: Add repository for kubernetes to Apt sources
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/kubernetes.list
    line: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubectl_version }}/deb/ /"
    state: present
    create: yes
  become: true

- name: Install kubectl
  ansible.builtin.apt:
    update_cache: yes
    name: kubectl
    state: present

- name: Pin kubectl to the installed version
  dpkg_selections:
    name: kubectl
    selection: hold
