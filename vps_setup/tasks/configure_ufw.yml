- name: Ensure UFW is installed
  apt:
    name: ufw
    state: present

- name: Set UFW default policies
  community.general.ufw:
    policy: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { policy: "deny", direction: "incoming" }
    - { policy: "allow", direction: "outgoing" }

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: on

